<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지미술학원 재료구매 신청</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --line: #d6dbe6;
      --soft: #f4f6f9;
      --paper: #ffffff;
      --accent: #002fbb;
      --accent-dark: #001f82;
      --accent-soft: #edf3ff;
      --accent-line: #8fb0ff;
      --ok: #1f7a4d;
      --warn: #a85d00;
      --bad: #a83232;
      --shadow: 0 12px 30px rgba(25, 33, 46, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .export-message {
      min-height: 0;
      padding: 0 22px;
      background: var(--paper);
      color: var(--muted);
      border-bottom: 1px solid transparent;
    }

    .export-message.active {
      min-height: 44px;
      padding-top: 10px;
      padding-bottom: 10px;
      border-bottom-color: var(--line);
    }

    .export-message a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .export-message textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 850;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 750;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(0, 47, 187, .18);
    }

    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: var(--bad); border-color: #e6b9b9; }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
      background: #e8ebf0;
    }

    input, select, textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .required-field {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      border-width: 2px;
      font-weight: 800;
    }

    .required-field::placeholder {
      color: #274278;
      opacity: 1;
    }

    textarea {
      resize: vertical;
      min-height: 124px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(340px, .9fr);
      gap: 16px;
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px;
    }

    main.admin-mode {
      grid-template-columns: 1fr;
    }

    main.admin-mode > aside {
      display: none;
    }

    main.admin-mode > section:first-child {
      display: none;
    }

    .tabs, .bar, .panel, .admin-band {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 6px;
      box-shadow: none;
    }

    .tabs button {
      border: 0;
      flex: 1;
      background: transparent;
    }

    .tabs button.active {
      background: #e7f4f7;
      color: var(--accent-dark);
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .month-pill {
      display: inline-flex;
      margin-top: 4px;
      color: var(--ok);
      font-size: 13px;
      font-weight: 800;
    }

    .bar {
      padding: 14px;
      margin-bottom: 12px;
      border-color: var(--accent-line);
      background: #f8fbff;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) .75fr .65fr;
      gap: 8px;
    }

    .admin-tools, .order-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .admin-tools {
      grid-template-columns: minmax(180px, .8fr) minmax(220px, 1fr);
      align-items: end;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 10px;
    }

    .product {
      min-height: 210px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .product h3 {
      margin: 0 0 7px;
      font-size: 15px;
      line-height: 1.35;
      word-break: keep-all;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid #e3e7ef;
      white-space: nowrap;
    }

    .unavailable {
      color: var(--bad);
      background: #fff0f0;
      border-color: #efc8c8;
    }

    .warn {
      color: var(--warn);
      background: #fff7e8;
      border-color: #efd4a6;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .price {
      font-size: 18px;
      font-weight: 850;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    aside {
      display: grid;
      gap: 12px;
      align-content: start;
      position: sticky;
      top: 82px;
    }

    .panel {
      padding: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(20, 27, 38, .38);
      z-index: 50;
      padding: 18px;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(360px, 100%);
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal h2 {
      margin-bottom: 10px;
    }

    .student-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .campus-box {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      font-weight: 850;
    }

    .order-panel {
      border-color: var(--accent-line);
      box-shadow: 0 12px 34px rgba(0, 47, 187, .12);
    }

    .order-panel h2 {
      color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #fafbfc;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    td.number, th.number {
      text-align: right;
      white-space: nowrap;
    }

    .qty {
      width: 64px;
      min-height: 34px;
      padding: 6px;
      text-align: center;
    }

    .total-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #c6e4e9;
      border-radius: 8px;
      background: #eef9fb;
      font-weight: 850;
    }

    .empty {
      color: var(--muted);
      padding: 18px;
      background: var(--soft);
      border: 1px dashed #c6ceda;
      border-radius: 8px;
      text-align: center;
    }

    .admin-band {
      grid-column: 1 / -1;
      padding: 14px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(340px, .85fr);
      gap: 14px;
    }

    .admin-panels {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      margin-top: 14px;
    }

    .receipt {
      background: #fff;
      border: 1px solid #1f2937;
      padding: 14px;
      max-width: 620px;
    }

    .receipt-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: end;
      border-bottom: 2px solid #1f2937;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .receipt-title strong {
      font-size: 20px;
    }

    .product-admin {
      max-height: 460px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .status-ok { color: var(--ok); font-weight: 800; }
    .status-warn { color: var(--warn); font-weight: 800; }

    .hidden { display: none !important; }

    @media print {
      body { background: #fff; }
      header, .tabs, .bar, aside, .admin-grid > div:first-child, .admin-panels { display: none; }
      main, .admin-band, .admin-grid { display: block; padding: 0; box-shadow: none; border: 0; }
      .receipt { max-width: none; border: 0; }
    }

    @media (max-width: 960px) {
      header, main, .filters, .admin-grid, .admin-panels {
        grid-template-columns: 1fr;
      }
      aside { position: static; }
      .top-actions { justify-content: start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>이미지미술학원 재료구매 신청</h1>
      <span class="month-pill" id="monthLabel"></span>
    </div>
  </header>
  <div class="export-message" id="exportMessage" role="status"></div>

  <main>
    <section>
      <nav class="tabs">
        <button class="active" data-tab="student">학생 주문</button>
        <button data-tab="admin">관리자</button>
      </nav>

      <div class="bar">
        <div class="filters">
          <input id="search" type="search" placeholder="상품명, 색상, 옵션 검색">
          <select id="categoryFilter"></select>
          <select id="statusFilter">
            <option value="available" selected>주문 가능</option>
            <option value="all">전체 상태</option>
            <option value="unavailable">현재 주문 불가</option>
          </select>
        </div>
      </div>

      <div class="catalog" id="catalog"></div>
    </section>

    <aside>
      <section class="panel order-panel">
        <h2>주문서</h2>
        <div class="student-grid">
          <input id="attendanceNo" class="required-field" placeholder="출결번호 입력" inputmode="numeric" value="">
          <input id="studentName" class="required-field" placeholder="학생명 입력" value="">
        </div>
        <div class="student-grid">
          <div class="campus-box" id="campusLabel"></div>
          <input id="orderDate" class="required-field" type="date">
        </div>
        <div class="student-grid">
          <select id="orderMode" class="required-field">
            <option value="new">새 주문 작성</option>
            <option value="add">기존 주문에 추가</option>
            <option value="replace">기존 주문 수정</option>
          </select>
        </div>
        <div class="order-tools">
          <button id="loadExistingOrder">내 주문 불러오기</button>
          <button id="deleteOwnOrder" class="danger">내 주문 삭제</button>
        </div>
        <div class="manual-entry">
          <h3>목록에 없는 재료 직접 입력</h3>
          <div class="manual-entry-grid">
            <input id="manualItemName" placeholder="재료명 입력">
            <input id="manualItemQty" type="number" min="1" value="1" aria-label="수량">
          </div>
          <p class="subtle">직접 입력 재료는 학원 확인 후 금액이 반영됩니다.</p>
          <button id="addManualItem" class="primary">직접 입력 재료 담기</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>상품</th>
              <th class="number">수량</th>
              <th class="number">금액</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cartRows"></tbody>
        </table>
        <div class="total-box">
          <span>청구금액</span>
          <span id="cartTotal">0원</span>
        </div>
        <div class="top-actions" style="margin-top:12px">
          <button class="primary" id="saveOrder">주문 저장</button>
        </div>
        <p class="subtle" id="saveMessage" role="status"></p>
        <p class="subtle">학생 화면 가격은 100원 단위로 올림 표시합니다. 상품번호와 구매 URL은 관리자 화면에만 표시됩니다.</p>
      </section>
    </aside>

    <section class="admin-band" id="adminArea">
      <div class="top-actions" style="align-items:center;margin-bottom:10px">
        <h2 style="margin:0;margin-right:auto">관리자</h2>
        <button id="exportOrders">주문 CSV</button>
        <button id="exportSmsXlsx">문자발송 CSV</button>
        <button id="printReceipt">명세표 인쇄</button>
        <button id="resetApp" class="danger">다음 달 주문 시작</button>
        <button id="adminLogout">관리자 로그아웃</button>
      </div>
      <div class="admin-tools">
        <label>
          <span class="subtle">수정 마감일</span>
          <input id="deadlineDate" type="date">
        </label>
        <p class="subtle" id="deadlineStatus"></p>
      </div>
      <div class="admin-grid">
        <div>
          <table>
            <thead>
              <tr>
                <th>학생</th>
                <th>상태</th>
                <th>주문일</th>
                <th class="number">품목수</th>
                <th class="number">청구금액</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orderRows"></tbody>
          </table>
        </div>
        <div>
          <textarea id="smsText" readonly></textarea>
          <div style="height:10px"></div>
          <div id="receipt" class="receipt"></div>
        </div>
      </div>

      <div class="admin-panels">
        <div>
          <h2>주문 품목 모음</h2>
          <div id="purchaseGroups"></div>
        </div>
        <div>
          <h2>상품 관리</h2>
          <div class="product-admin">
            <table>
              <thead>
                <tr>
                  <th>상품</th>
                  <th class="number">원가</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody id="productAdminRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="adminGate" role="dialog" aria-modal="true" aria-labelledby="adminGateTitle">
    <div class="modal">
      <h2 id="adminGateTitle">관리자 확인</h2>
      <input id="adminPasswordInput" type="password" placeholder="관리자 비밀번호">
      <p class="subtle" id="adminPasswordMessage" role="status"></p>
      <div class="top-actions" style="margin-top:12px">
        <button id="adminPasswordCancel">취소</button>
        <button class="primary" id="adminPasswordSubmit">확인</button>
      </div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get("reset") === "1") {
      Object.keys(localStorage)
        .filter(key => key.startsWith("imageArtCartV3_") || key.startsWith("imageArtOrdersV3_"))
        .forEach(key => localStorage.removeItem(key));
      history.replaceState(null, "", window.location.pathname);
    }

    const now = new Date();
    const seoulParts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
    const monthText = `${seoulParts.year}년 ${Number(seoulParts.month)}월 신청`;
    const todayText = `${seoulParts.year}-${seoulParts.month}-${seoulParts.day}`;
    const won = value => `${Math.round(value || 0).toLocaleString("ko-KR")}원`;
    const roundDisplay = value => Math.ceil((Number(value) || 0) / 100) * 100;
    const adminPassword = "1234";
    const campusConfigs = {
      painting: { id: "painting", label: "회화반", account: "본관" },
      design: { id: "design", label: "디자인반", account: "본관" },
      davinci: { id: "davinci", label: "다빈치관", account: "다빈치" },
      yongsan: { id: "yongsan", label: "용산캠퍼스", account: "본관" }
    };
    const campusParam = new URLSearchParams(window.location.search).get("campus");
    const savedCampusId = localStorage.getItem("imageArtCampusV3");
    const campus = campusConfigs[campusParam] || campusConfigs[savedCampusId] || campusConfigs.painting;
    localStorage.setItem("imageArtCampusV3", campus.id);
    const storageKey = name => `imageArt${name}V3_${campus.id}`;
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqNanBl77-1EI0ryiZ5BwJHV_HIud8Azr9fqmiIo5aVORvEVUrPoaKgn27XrxploXWPA/exec"; // Google Apps Script 배포 URL을 여기에 붙여넣으세요.
    const useCloud = () => APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("https://");

    function apiGet(action, params = {}) {
      if (!useCloud()) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const callback = `imageArtCallback_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const query = new URLSearchParams({ action, campus: campus.id, callback, ...params });
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Google Sheets 응답 시간이 초과되었습니다."));
        }, 15000);
        function cleanup() {
          clearTimeout(timer);
          delete window[callback];
          script.remove();
        }
        window[callback] = data => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("Google Sheets 연결에 실패했습니다."));
        };
        script.src = `${APPS_SCRIPT_URL}?${query.toString()}`;
        document.body.appendChild(script);
      });
    }

    function apiPost(payload) {
      if (!useCloud()) return Promise.resolve();
      return fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ campus: campus.id, ...payload })
      });
    }

    const baseProducts = [
      {
        id: "ire-tombow-monoj",
        title: "톰보우 모노J 연필 1타스 (12자루) 종류선택",
        category: "연필/지우개",
        source: "이레화방",
        productNo: "2286",
        url: "https://www.irehb.co.kr/shop/shopdetail.html?branduid=2286",
        rawPrice: 11120,
        options: [
          "6B - 1타스 (12자루)",
          "4B - 1타스 (12자루)",
          "3B - 1타스 (12자루)",
          "2B - 1타스 (12자루)",
          "B - 1타스 (12자루)",
          "HB - 1타스 (12자루)",
          "H - 1타스 (12자루)",
          "2H - 1타스 (12자루)",
          "3H - 1타스 (12자루)",
          "4H - 1타스 (12자루)"
        ]
      },
      {
        id: "ire-tombow-eraser",
        title: "톰보우 미술용 지우개 1팩 (10개입)",
        category: "연필/지우개",
        source: "이레화방",
        rawPrice: 2300,
        productNo: "1135",
        url: "https://www.irehb.co.kr/shop/shopdetail.html?branduid=1135"
      },
      {
        id: "ire-hwahong-eraser-pink",
        title: "화홍 4B 미술용 지우개 1팩 (10개입) 핑크색",
        category: "연필/지우개",
        source: "이레화방",

    const state = {
      products: mergeProductState(),
      cart: JSON.parse(localStorage.getItem(storageKey("Cart")) || "[]"),
      orders: migrateOrders(JSON.parse(localStorage.getItem(storageKey("Orders")) || "[]")),
      settings: JSON.parse(localStorage.getItem(storageKey("Settings")) || "{}"),
      selectedOrder: 0,
      activeTab: "student",
      adminUnlocked: sessionStorage.getItem("imageArtAdminUnlocked") === "true"
    };
    let lastExportUrl = "";

    document.getElementById("monthLabel").textContent = monthText;
    document.getElementById("campusLabel").textContent = campus.label;
    document.getElementById("orderDate").value = todayText;
    document.getElementById("deadlineDate").value = state.settings.deadlineDate || "";

    function migrateOrders(orders) {
      return orders.map((order, index) => ({
        attendanceNo: order.attendanceNo || "",
        academyAccount: order.academyAccount || campus.account,
        campusId: order.campusId || campus.id,
        campusLabel: order.campusLabel || campus.label,
        smsStatus: order.smsStatus || "not_sent",
        smsSentAt: order.smsSentAt || "",
        updatedAt: order.updatedAt || order.date || todayText,
        createdAt: order.createdAt || order.date || todayText,
        ...order,
        items: (order.items || []).map(item => ({ ...item })),
        legacyKey: order.attendanceNo ? "" : `legacy-${index}`
      }));
    }

    function mergeProductState() {
      const saved = JSON.parse(localStorage.getItem("imageArtProductsV3") || "{}");
      return baseProducts.map(product => ({
        available: product.available !== false,
        ...product,
        ...(saved[product.id] || {})
      }));
    }

    function applyProductOverrides(overrides = {}) {
      state.products = baseProducts.map(product => ({
        available: product.available !== false,
        ...product,
        ...(overrides[product.id] || {})
      }));
      localStorage.setItem("imageArtProductsV3", JSON.stringify(overrides));
    }

    async function loadCloudData() {
      if (!useCloud()) {
        setExportMessage("Google Apps Script URL이 아직 설정되지 않아 이 브라우저에 임시 저장됩니다.");
        return;
      }
      try {
        const data = await apiGet("bootstrap");
        if (!data || !data.ok) throw new Error(data?.error || "데이터를 불러오지 못했습니다.");
        state.orders = migrateOrders(data.orders || []);
        state.settings = data.settings || {};
        applyProductOverrides(data.products || {});
        document.getElementById("deadlineDate").value = state.settings.deadlineDate || "";
        saveCart();
        localStorage.setItem(storageKey("Orders"), JSON.stringify(state.orders));
        localStorage.setItem(storageKey("Settings"), JSON.stringify(state.settings));
        setExportMessage("Google Sheets와 연결되었습니다.");
      } catch (error) {
        setExportMessage(`Google Sheets 연결 실패: ${xmlEscape(error.message || error)}<br>현재 브라우저 임시 저장값으로 표시합니다.`);
      }
    }

    function saveProducts() {
      const overrides = {};
      state.products.forEach(product => {
        const base = baseProducts.find(item => item.id === product.id);
        if (!base || product.rawPrice !== base.rawPrice || product.available !== (base.available !== false)) {
          overrides[product.id] = { rawPrice: product.rawPrice, available: product.available };
        }
      });
      localStorage.setItem("imageArtProductsV3", JSON.stringify(overrides));
      apiPost({ action: "saveProducts", products: overrides }).catch(() => {});
    }

    function saveCart() {
      localStorage.setItem(storageKey("Cart"), JSON.stringify(state.cart));
    }

    function saveOrders() {
      localStorage.setItem(storageKey("Orders"), JSON.stringify(state.orders));
      apiPost({ action: "replaceOrders", orders: state.orders }).catch(() => {});
    }

    function saveSettings() {
      localStorage.setItem(storageKey("Settings"), JSON.stringify(state.settings));
      apiPost({ action: "saveSettings", settings: state.settings }).catch(() => {});
    }

    function deadlinePassed() {
      return state.settings.deadlineDate && todayText > state.settings.deadlineDate;
    }

    function orderStatusText(order) {
      if (order.smsStatus === "sent") return "문자 발송완료";
      if (order.smsStatus === "needs_resend") return "재발송 필요";
      return deadlinePassed() ? "수정마감" : "수정 가능";
    }

    function orderByAttendanceNo(attendanceNo) {
      return state.orders.find(order => order.attendanceNo && order.attendanceNo === attendanceNo);
    }

    function normalizeStudentName(name) {
      return String(name || "").replace(/\s+/g, "").trim();
    }

    function orderMatchesStudent(order, studentName) {
      return normalizeStudentName(order && order.student) === normalizeStudentName(studentName);
    }

    function mergeCartItems(baseItems, addedItems) {
      const merged = baseItems.map(item => ({ ...item }));
      addedItems.forEach(item => {
        const existing = merged.find(target => target.key === item.key);
        if (existing) existing.qty += item.qty;
        else merged.push({ ...item });
      });
      return merged;
    }

    function optionName(option) {
      return typeof option === "string" ? option : option.name;
    }

    function optionPrice(product, selectedOption) {
      const found = (product.options || []).find(option => optionName(option) === selectedOption);
      return typeof found === "object" && found.rawPrice ? found.rawPrice : product.rawPrice;
    }

    function selectedOptionData(product, selectedOption) {
      return (product.options || []).find(option => optionName(option) === selectedOption);
    }

    function unitPrice(product, selectedOption) {
      return roundDisplay(optionPrice(product, selectedOption));
    }

    function parseMoney(value) {
      const cleaned = String(value || "").replace(/[^0-9]/g, "");
      return Number(cleaned || 0);
    }

    function itemQty(item) {
      return Number(item.qty || item.quantity || 1);
    }

    function itemUnitPrice(item) {
      return Number(item.unitPrice || item.price || item.rawPrice || 0);
    }

    function itemAmount(item) {
      return itemUnitPrice(item) * itemQty(item);
    }

    function billingTotal(items = state.cart) {
      return Math.ceil(items.reduce((sum, item) => sum + itemAmount(item), 0) * 1.01 / 100) * 100;
    }

    function cartTotal(items = state.cart) {
      return billingTotal(items);
    }

    function categories() {
      return ["분류 선택", ...Array.from(new Set(state.products.map(product => product.category))).sort((a, b) => a.localeCompare(b, "ko"))];
    }

    function renderFilters() {
      document.getElementById("categoryFilter").innerHTML = categories().map((item, index) => `<option value="${index ? item : ""}">${item}</option>`).join("");
    }

    function renderCatalog() {
      const search = document.getElementById("search").value.trim().toLowerCase();
      const category = document.getElementById("categoryFilter").value;
      const status = document.getElementById("statusFilter").value;
      if (!search && !category) {
        document.getElementById("catalog").innerHTML = `<div class="empty">상품명이나 색상을 검색하거나 분류를 선택해주세요.</div>`;
        return;
      }
      const filtered = state.products.filter(product => {
        const optionText = (product.options || []).map(optionName).join(" ");
        const text = `${product.title} ${product.category} ${optionText}`.toLowerCase();
        return (!search || text.includes(search))
          && (!category || product.category === category)
          && (status === "all" || (status === "available" ? product.available : !product.available));
      });
      document.getElementById("catalog").innerHTML = filtered.map(product => productCard(product, search)).join("") || `<div class="empty">검색 결과가 없습니다.</div>`;
    }

    function productCard(product, searchTerm = "") {
      const options = product.options || [];
      const selectedOption = options.length
        ? (options.find(option => optionName(option).toLowerCase().includes(searchTerm)) || options[0])
        : "";
      const selectedOptionName = selectedOption ? optionName(selectedOption) : "";
      const optionSelect = options.length ? `
        <select data-option="${product.id}" ${product.available ? "" : "disabled"}>
          ${options.map(option => `<option value="${optionName(option)}" ${optionName(option) === selectedOptionName ? "selected" : ""}>${optionName(option)}</option>`).join("")}
        </select>
      ` : "";
      const displayPrice = unitPrice(product, selectedOptionName);
      return `
        <article class="product">
          <div>
            <h3>${product.title}</h3>
            <div class="meta">
              <span class="tag">${product.category}</span>
              ${product.available ? `<span class="tag">주문 가능</span>` : `<span class="tag unavailable">현재 주문 불가</span>`}
            </div>
          </div>
          <div>${optionSelect}</div>
          <div class="price-row">
            <div>
              <div class="price" id="price-${product.id}">${won(displayPrice)}</div>
              <div class="subtle">표시가</div>
            </div>
            <button class="primary" data-add="${product.id}" ${product.available ? "" : "disabled"}>담기</button>
          </div>
        </article>
      `;
    }

    function renderCart() {
      document.getElementById("cartRows").innerHTML = state.cart.map((item, index) => `
        <tr>
          <td>${item.title}${item.option ? `<br><span class="subtle">${item.option}</span>` : ""}</td>
          <td class="number"><input class="qty" type="number" min="1" value="${item.qty}" data-cart-qty="${index}"></td>
          <td class="number">${won(item.unitPrice * item.qty)}</td>

      `).join("") || `<tr><td colspan="4"><div class="empty">장바구니가 비어 있습니다.</div></td></tr>`;

    function addToCart(productId) {
      const product = state.products.find(item => item.id === productId);
      if (!product || !product.available) return;
      const optionElement = document.querySelector(`[data-option="${productId}"]`);
      const option = optionElement ? optionElement.value : "";
      const optionData = selectedOptionData(product, option);
      const price = unitPrice(product, option);
      const key = `${productId}::${option}`;
      const existing = state.cart.find(item => item.key === key);
      if (existing) existing.qty += 1;
      else {
        state.cart.push({
          key,
          productId,
          title: product.title,
          option,
          qty: 1,
          unitPrice: price,
          rawPrice: optionPrice(product, option),
          source: product.source,
          productNo: (typeof optionData === "object" && optionData.productNo) || product.productNo || "",
          url: (typeof optionData === "object" && optionData.url) || product.url || ""
        });
      }
      saveCart();
      renderCart();
    }

    function saveOrder() {
      const attendanceNo = document.getElementById("attendanceNo").value.trim();
      const student = document.getElementById("studentName").value.trim();
      const academyAccount = campus.account;
      const mode = document.getElementById("orderMode").value;
      const message = document.getElementById("saveMessage");
      if (deadlinePassed()) {
        message.textContent = "수정 마감일이 지나 학생 화면에서는 저장할 수 없습니다. 학원에 문의해주세요.";
        return;
      }
      if (!attendanceNo) {
        message.textContent = "출결번호를 입력해주세요.";
        document.getElementById("attendanceNo").focus();
        return;
      }
      if (!student) {
        message.textContent = "학생명을 입력해주세요.";
        document.getElementById("studentName").focus();
        return;
      }
      if (!state.cart.length) {
        message.textContent = "장바구니에 담긴 품목이 없습니다.";
        return;
      }
      const existing = orderByAttendanceNo(attendanceNo);
      const nowText = new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
      if (existing) {
        if (mode === "new") {
          message.textContent = "이미 같은 출결번호 주문이 있습니다. 기존 주문에 추가하거나 기존 주문 수정을 선택해주세요.";
          return;
        }
        if (!orderMatchesStudent(existing, student)) {
          message.textContent = "출결번호와 학생명이 기존 주문 정보와 일치하지 않습니다.";
          document.getElementById("studentName").focus();
          return;
        }
        existing.student = student;
        existing.academyAccount = academyAccount;
        existing.campusId = campus.id;
        existing.campusLabel = campus.label;
        existing.date = document.getElementById("orderDate").value || todayText;
        existing.month = monthText.replace(" 신청", "");
        existing.items = mode === "replace"
          ? state.cart.map(item => ({ ...item }))
          : mergeCartItems(existing.items || [], state.cart);
        existing.updatedAt = nowText;
        if (existing.smsStatus === "sent") existing.smsStatus = "needs_resend";
        state.selectedOrder = state.orders.indexOf(existing);
        message.textContent = mode === "replace" ? "기존 주문을 수정했습니다." : "기존 주문에 추가했습니다.";
      } else {
        if (mode !== "new") {
          message.textContent = "저장된 기존 주문이 없습니다. 새 주문 작성으로 저장해주세요.";
          return;
        }
        state.orders.unshift({
          attendanceNo,
          student,
          academyAccount,
          campusId: campus.id,
          campusLabel: campus.label,
          date: document.getElementById("orderDate").value || todayText,
          month: monthText.replace(" 신청", ""),
          createdAt: nowText,
          updatedAt: nowText,
          smsStatus: "not_sent",
          smsSentAt: "",
          items: state.cart.map(item => ({ ...item }))
        });
        state.selectedOrder = 0;
        message.textContent = "주문이 저장되었습니다.";
      }
      state.cart = [];
      saveCart();
      saveOrders();
      renderAll();
    }

      const label = `${order.student || "이름 없음"} (${order.attendanceNo || "출결번호 없음"})`;

삭제하면 되돌릴 수 없습니다.`)) return;

    function exportOrders() {
      const header = ["출결번호", "학생명", "PC구분", "학원구분", "문자상태", "주문일", "최종수정", "상품명", "옵션", "수량", "단가", "금액", "관리상품번호"];
      const rows = state.orders.flatMap(order => order.items.map(item => [
        order.attendanceNo, order.student, order.campusLabel || campus.label, order.academyAccount || campus.account, orderStatusText(order), order.date, order.updatedAt, item.title, item.option, itemQty(item), itemUnitPrice(item), itemAmount(item), item.productNo
      ]));
      const csv = [header, ...rows].map(row => row.map(cell => `"${String(cell || "").replaceAll('"', '""')}"`).join(",")).join("\n");

    function setExportMessage(html) {
      const message = document.getElementById("exportMessage");
      message.classList.add("active");
      message.innerHTML = html;
    }

    function downloadBlob(blob, filename) {
      if (lastExportUrl) URL.revokeObjectURL(lastExportUrl);
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      lastExportUrl = url;
      link.href = url;
      link.download = filename;
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      return { url, filename };
    }

    function showExportLink(url, filename) {
      setExportMessage(`다운로드가 자동으로 시작되지 않으면 <a href="${url}" download="${filename}">${filename} 저장하기</a>를 눌러주세요.`);
    }

    function xmlEscape(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function columnName(index) {
      let name = "";
      while (index > 0) {
        const mod = (index - 1) % 26;
        name = String.fromCharCode(65 + mod) + name;
        index = Math.floor((index - mod) / 26);
      }
      return name;
    }

    function smsExportRows() {
      const sheetName = `${String(seoulParts.year).slice(2)}.${seoulParts.month}`;
      const rows = [
        ["재료구매표", "", "", "", "", "", "", "", "주문날짜", sheetName, "", "", "", "", "", "", "", "", "총계", "납부일"],
        ["no.", "이름", "학원구분", "품목1", "품목2", "품목3", "품목4", "품목5", "품목6", "품목7", "금액1", "금액2", "금액3", "금액4", "금액5", "금액6", "금액7", "", "총계", "납부일"],
        ["", "", "본관/다빈치 선택", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]
      ];
      state.orders
        .slice()
        .sort((a, b) => Number(a.attendanceNo || 0) - Number(b.attendanceNo || 0) || String(a.student).localeCompare(String(b.student), "ko"))
        .forEach(order => {
          const lineItems = (order.items || []).map(item => ({
            name: `${item.title}${item.option ? ` ${item.option}` : ""}${itemQty(item) > 1 ? ` ${itemQty(item)}개` : ""}`,
            amount: itemAmount(item)
          }));
          let visibleItems = lineItems.slice(0, 7);
          if (lineItems.length > 7) {
            const rest = lineItems.slice(6);
            visibleItems = [
              ...lineItems.slice(0, 6),
              {
                name: `${rest[0].name} 외 ${rest.length - 1}건`,
                amount: rest.reduce((sum, item) => sum + item.amount, 0)
              }
            ];
          }
          const items = Array.from({ length: 7 }, (_, index) => visibleItems[index]?.name || "");
          const amounts = Array.from({ length: 8 }, (_, index) => visibleItems[index]?.amount || "");
          const attendance = /^\d+$/.test(String(order.attendanceNo || "")) ? Number(order.attendanceNo) : order.attendanceNo;
          rows.push([
            attendance,
            order.student,
            order.academyAccount || campus.account,
            ...items,
            ...amounts,
            cartTotal(order.items),
            ""
          ]);
        });
      return { sheetName, rows };
    }

    function buildSmsCsvBlob() {
      return new Blob(["\ufeff" + buildSmsCsvText()], { type: "text/csv;charset=utf-8" });
    }

    function buildSmsCsvText() {
      const { rows } = smsExportRows();
      return rows
        .map(row => row.map(cell => `"${String(cell ?? "").replaceAll('"', '""')}"`).join(","))
        .join("\n");
    }

    async function exportSmsXlsx() {
      if (!state.orders.length) {
        setExportMessage("내보낼 주문이 없습니다. 학생 주문을 먼저 저장한 뒤 다시 눌러주세요.");
        return;
      }
      const invalid = state.orders.filter(order => !/^\d+$/.test(String(order.attendanceNo || "")));
      if (invalid.length) {
        setExportMessage("출결번호는 숫자여야 문자발송 CSV에서 인식됩니다. 출결번호를 확인해주세요.");
        return;
      }
      const filename = `${seoulParts.year}-${seoulParts.month}_${campus.label}_학생재료구매목록.csv`;
      const csvText = buildSmsCsvText();
      const csvWithBom = "\ufeff" + csvText;
      const blob = new Blob([csvWithBom], { type: "text/csv;charset=utf-8" });
      const { rows } = smsExportRows();
      const preview = rows.slice(0, 8).map(row => row.join(" | ")).join("\n");
      setExportMessage(`문자발송 CSV를 만들었습니다. 주문 ${state.orders.length}명, 전체 ${rows.length}줄입니다.<textarea readonly>${xmlEscape(preview)}</textarea>`);
      try {
        const response = await fetch("/save-csv", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename, text: csvText })
        });
        if (response.ok) {
          const result = await response.json();
          const emailText = result.email?.enabled
            ? (result.email.sent ? `메일 전송 완료: ${xmlEscape((result.email.to || []).join(", "))}` : `메일 전송 실패: ${xmlEscape(result.email.error || "설정을 확인해주세요.")}`)
            : "메일 자동전송 꺼짐";
          setExportMessage(`${filename} 저장 완료: ${xmlEscape(result.path)}<br>${emailText}<textarea readonly>${xmlEscape(preview)}</textarea>`);
          return;
        }
      } catch (error) {
        // Static file servers do not support direct saving; fall back to browser save.
      }
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: "CSV 파일", accept: { "text/csv": [".csv"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(csvWithBom);
          await writable.close();
          setExportMessage(`${filename} 저장이 완료되었습니다. 주문 ${state.orders.length}명, 전체 ${rows.length}줄입니다.<textarea readonly>${xmlEscape(preview)}</textarea>`);
          return;
        } catch (error) {
          if (error.name === "AbortError") {
            setExportMessage("CSV 저장을 취소했습니다.");
            return;
          }
        }
      }
      const file = downloadBlob(blob, filename);
      showExportLink(file.url, file.filename);
      document.getElementById("saveMessage").textContent = "문자발송 CSV 다운로드를 시작했습니다. 다운로드 폴더 또는 상단 저장 링크를 확인해주세요.";
    }

    async function handleSmsExportClick() {
      try {
        await exportSmsXlsx();
      } catch (error) {
        console.error(error);
        setExportMessage(`문자발송 CSV를 만드는 중 문제가 생겼습니다: ${xmlEscape(error.message || error)}`);
      }
    }

          openAdminGate();
          return;
        }
        activateTab(tabName);

      if (event.target.dataset.add) addToCart(event.target.dataset.add);
      if (event.target.dataset.remove !== undefined) {
        state.cart.splice(Number(event.target.dataset.remove), 1);
        saveCart();
        renderCart();
      }
      if (event.target.dataset.order !== undefined) {
        state.selectedOrder = Number(event.target.dataset.order);
        renderSelectedOrder();
      }
      if (event.target.dataset.deleteOrder !== undefined) {
        deleteOrder(Number(event.target.dataset.deleteOrder));
      }
      if (event.target.dataset.smsSent !== undefined) {
        const order = state.orders[Number(event.target.dataset.smsSent)];
        if (!order) return;
        order.smsStatus = "sent";
        order.smsSentAt = new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
        saveOrders();
        renderOrders();
      }
      if (event.target.dataset.smsUnsent !== undefined) {

        order.smsStatus = "not_sent";
        order.smsSentAt = "";
        saveOrders();
        renderOrders();

        const index = Number(event.target.dataset.cartQty);
        state.cart[index].qty = Math.max(1, Number(event.target.value) || 1);
        saveCart();
        renderCart();
      }
      if (event.target.dataset.price) {
        const product = state.products.find(item => item.id === event.target.dataset.price);
        product.rawPrice = Math.max(0, Number(event.target.value) || 0);
        saveProducts();

      if (event.target.dataset.available) {

    document.getElementById("printReceipt").addEventListener("click", () => window.print());
    document.getElementById("resetApp").addEventListener("click", () => {
      if (!confirm("이번 달 주문을 비우고 다음 달 주문을 시작할까요? 진행 전 주문 CSV와 문자발송 CSV를 저장했는지 확인해주세요. 상품과 가격표는 유지됩니다.")) return;
      state.cart = [];
      state.orders = [];
      state.settings.deadlineDate = "";
      document.getElementById("deadlineDate").value = "";
      localStorage.removeItem(storageKey("Cart"));
      localStorage.removeItem(storageKey("Orders"));
      apiPost({ action: "resetOrders" }).catch(() => {});
      saveSettings();
      renderAll();
    });

    async function initApp() {
      renderFilters();
      renderAll();
      await loadCloudData();
      renderFilters();
      renderAll();
    }

    initApp();
  </script>
</body>
</html>
